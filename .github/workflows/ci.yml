name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Check that the committed mbedtls_aes.{c,h} matches what's generated.
  amalgamate-fresh:
    runs-on: ubuntu-latest
    name: amalgamate-fresh
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Regenerate and diff
        run: |
          make amalgamate
          git diff --exit-code -- mbedtls_aes.c mbedtls_aes.h

  # Native builds
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  os: ubuntu-latest }
          - { name: macos-arm64,   os: macos-latest }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: make check
        run: make check

  # Cross builds under qemu-user-static
  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, apt: "gcc-aarch64-linux-gnu libc6-dev-arm64-cross" }
          - { arch: armv7,   apt: "gcc-arm-linux-gnueabihf libc6-dev-armhf-cross" }
          - { arch: riscv64, apt: "gcc-riscv64-linux-gnu libc6-dev-riscv64-cross" }
    name: cross-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install cross toolchain and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt }} qemu-user-static
      - name: Cross build and test
        run: ./scripts/cross.sh ${{ matrix.arch }}
